apiVersion: v1
kind: Service
metadata:
  name: signaling-server
  namespace: quick-share
  labels:
    app: signaling-server
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/health/metrics"
    prometheus.io/port: "3001"
spec:
  selector:
    app: signaling-server
  ports:
  - port: 80
    targetPort: 3001
    protocol: TCP
    name: http
  type: ClusterIP